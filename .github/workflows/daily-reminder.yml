name: Daily push reminder

on:
  schedule:
    # Checks every 15 minutes; send.mjs only sends when a subscriber's chosen
    # local time (from their setup code) has arrived, once per day.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Send to every subscription right now (for testing)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write          # cache save + the keep-alive step

concurrency:
  group: daily-reminder
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
      STATE_FILE: ${{ github.workspace }}/push-state.json
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Remembers which subscriptions were already sent to today.
      - name: Restore sent-today state
        uses: actions/cache/restore@v4
        with:
          path: push-state.json
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-
      - name: Anything due?
        id: check
        working-directory: push
        run: node send.mjs --check
      - name: Install web-push
        if: steps.check.outputs.due == 'true'
        working-directory: push
        run: npm install --no-audit --no-fund
      - name: Send reminder
        if: steps.check.outputs.due == 'true'
        working-directory: push
        run: node send.mjs
      - name: Save sent-today state
        if: steps.check.outputs.due == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: push-state.json
          key: push-state-${{ github.run_id }}
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling it on every run keeps the reminder alive indefinitely.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily-reminder.yml --repo "$GITHUB_REPOSITORY" || true
